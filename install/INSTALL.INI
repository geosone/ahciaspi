; INSTALL.INI for the GeosOne DOS Installer (INSTALL.EXE, from
; https://github.com/geosone/gdi, GPL version 3)
[Setup]
Title=AHCIASPI Setup
Product=GeosOne AHCIASPI 0.4
Id=AHCIASPI
License=1,2
License1=AHCIASPI, OpenASPI|LICENSE.TXT
License2=SHSUCDX, CDAUDIO|SHSUCD.LIC
Readme=README.TXT
; the drivers in C:\OPENASPI with EUSBASPI and OpenASPI; this installer
; and its journals in C:\OPENASPI\AHCIASPI
DefaultDir=%BOOT%\OPENASPI
SetupDir=AHCIASPI
Done=AHCIASPI is installed; the OpenASPI drivers chosen are loaded after it in CONFIG.SYS. Restart the computer.

[Welcome]
AHCIASPI is an ASPI manager (SCSIMGR$) for ATAPI drives - CD/DVD,
ZIP, LS-120, tape - on AHCI SATA controllers (also behind SATA/IDE
adapters) and on IDE channels, for DOS and Windows 3.x DOS boxes.
ASPI drivers use the drives through it.

The OpenASPI drivers come with it: ASPICDA.SYS (CD/DVD, with SHSUCDX
for the drive letter and digital CD audio), ASPIFDD.SYS (ZIP, LS-120),
ASPIDSK.SYS (disks) and ASPITAP.SYS (tape). Setup copies AHCIASPI and the
drivers you choose to your hard disk and adds them to CONFIG.SYS.

[Options]
Option=on|Load AHCIASPI.SYS in CONFIG.SYS
Option=off|Load it into upper memory (DEVICEHIGH)|HIGH
Option=off|AHCI controllers only (no IDE channels, /NOIDE)| /NOIDE
Option=off|Drive letter tools (DLMANIPF.SYS/.COM)
Option=on|CD/DVD drives: ASPICDA.SYS, SHSUCDX instead of MSCDEX or NWCDEX
Option=on|ZIP, LS-120, LS-240, Clik!, Jaz: ASPIFDD.SYS
Option=?DISK|Disks, card readers and USB sticks: ASPIDSK.SYS
Option=?TAPE|Tape drives: ASPITAP.SYS
Option=on|Windows 3.x: 32-bit disk access for SATA/IDE disks (AHCIVXD.386)
Option=on|Add the installation directory to the PATH (ASPITEST, DLMANIPF from any directory)

; with AHCIASPI already loaded (a new setup), the devices found
; preselect the options
[Detect]
DISK=ASPISCAN.COM /Q /DISK
TAPE=ASPISCAN.COM /Q /TAPE

; the CD-ROM extension: SHSUCDX of this disk comes first (MSCDEX of MS-DOS,
; NWCDEX of DR-DOS only when a distributor took SHSUCDX off the disk)
[Find]
CDEX=SHSUCDX.COM SHSUCDX.EXE MSCDEX.EXE NWCDEX.EXE

[Files]
AHCIASPI.SYS
AHCIVXD.386
ASPITEST.COM
ASPISCAN.COM
README.TXT=AHCIASPI.TXT
LICENSE.TXT
5|ASPICDA.SYS
5|CDAUDIO.COM
5|SHSUCD.LIC
5|SHSUCD.TXT
6|ASPIFDD.SYS
7|ASPIDSK.SYS
8|ASPITAP.SYS
8|TAPECTL.COM
4|DLMANIPF.SYS
4|DLMANIPF.COM
4|DLMANIPF.TXT

[Config.sys]
Remove=AHCIASPI.SYS
Add=1|DEVICE%O2%=%DIR%\AHCIASPI.SYS%O3%
; the OpenASPI drivers after AHCIASPI (the lines of AHCIASPI 0.3 with
; Adaptec's ASPICD, ASPIDISK and MKELS120 go)
Remove=MKELS120.SYS
Remove=ASPIDISK.SYS
Remove=/D:ASPICD0
Remove=ASPICDA.SYS
Remove=ASPIFDD.SYS
Remove=ASPIDSK.SYS
Remove=ASPITAP.SYS
Add=1,5|DEVICE%O2%=%DIR%\ASPICDA.SYS /D:ASPICDA0
Add=1,6|DEVICE%O2%=%DIR%\ASPIFDD.SYS
Add=1,7|DEVICE%O2%=%DIR%\ASPIDSK.SYS
Add=1,8|DEVICE%O2%=%DIR%\ASPITAP.SYS

; Windows 3.x enhanced mode: AHCIVXD.386 instead of WDCTRL
[System.ini]
Remove=AHCIVXD.386
Remove=device=*wdctrl
Remove=device=*int13
Remove=32BitDiskAccess
Add=10|386Enh|device=*int13
Add=10|386Enh|device=%DIR%\AHCIVXD.386
Add=10|386Enh|32BitDiskAccess=on

; SHSUCDX in the place of MSCDEX or NWCDEX (INSTALL /U puts them back);
; ASPICDA0 to that line, else a new one
[Autoexec.bat]
Program=1,5,?CDEX|MSCDEX,NWCDEX,SHSUCDX|%CDEX%
Extend=1,5,?CDEX|MSCDEX,NWCDEX,SHSUCDX| /D:ASPICDA0|%CDEX% /D:ASPICDA0 /A:AUTO
PathAppend=11|%DIR%
Position=bottom
