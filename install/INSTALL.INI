; INSTALL.INI for the GeosOne DOS Installer (INSTALL.EXE, from
; https://github.com/geosone/gdi, GPL version 3)
[Setup]
Title=AHCIASPI Setup
Product=GeosOne AHCIASPI 0.1
License=LICENSE.TXT
Readme=README.TXT
DefaultDir=%BOOT%\AHCIASPI
Done=AHCIASPI is installed. Load your ASPI drivers (ASPICD.SYS, ASPIDISK.SYS, ...) after AHCIASPI.SYS in CONFIG.SYS, then restart the computer.

[Welcome]
AHCIASPI is an ASPI manager (SCSIMGR$) for ATAPI drives - CD/DVD,
ZIP, LS-120, tape - on AHCI SATA controllers (also behind SATA/IDE
adapters) and on IDE channels, for DOS and Windows 3.x DOS boxes.
ASPI drivers such as ASPICD.SYS, ASPIDISK.SYS, MKELS120.SYS or
GUEST.EXE use the drives through it.

This program copies AHCIASPI to your hard disk and adds it to CONFIG.SYS.

[Options]
Option=on|Load AHCIASPI.SYS in CONFIG.SYS
Option=off|Load it into upper memory (DEVICEHIGH)|HIGH
Option=off|AHCI controllers only (no IDE channels, /NOIDE)| /NOIDE
Option=off|Drive letter tools (DLMANIPF.SYS/.COM)
Option=on|CD-ROM drive: ASPICD.SYS and MSCDEX/SHSUCDX (if found)
Option=on|ZIP, LS-120 etc. as DOS drives: ASPIDISK.SYS (if found)
Option=on|LS-120/LS-240 drives: MKELS120.SYS (if found)

; ASPI drivers and CD-ROM programs: taken from this disk if they are
; on it (then installed to %DIR%), else searched on the computer
; (MS-DOS 7.1 has ASPICD.SYS and MSCDEX.EXE in C:\DOS)
[Find]
CDEX=SHSUCDX.COM SHSUCDX.EXE MSCDEX.EXE
ASPICD=ASPICD.SYS
ASPIDISK=ASPIDISK.SYS
MKELS120=MKELS120.SYS

[Files]
AHCIASPI.SYS
ASPITEST.COM
README.TXT
LICENSE.TXT
4|DLMANIPF.SYS
4|DLMANIPF.COM
4|DLMANIPF.TXT

[Config.sys]
Remove=AHCIASPI.SYS
Add=1|DEVICE%O2%=%DIR%\AHCIASPI.SYS%O3%
; the ASPI drivers after AHCIASPI
Remove=MKELS120.SYS
Add=1,7,?MKELS120|DEVICE%O2%=%MKELS120%
Remove=ASPIDISK.SYS
Add=1,6,?ASPIDISK|DEVICE%O2%=%ASPIDISK%
Remove=/D:ASPICD0
Add=1,5,?ASPICD,?CDEX|DEVICE%O2%=%ASPICD% /D:ASPICD0

; ASPICD0 to an existing MSCDEX/SHSUCDX line, else a new one
[Autoexec.bat]
Extend=1,5,?ASPICD,?CDEX|MSCDEX,SHSUCDX| /D:ASPICD0|%CDEX% /D:ASPICD0
Position=bottom
